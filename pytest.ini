[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output: verboso + tb curto
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Marcadores customizados
markers =
    slow: testes que demoram (deselect com '-m "not slow"')
    llm: testes que chamam LLM (deselect com '-m "not llm"')

# Não exibe DeprecationWarning de deps externas
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
