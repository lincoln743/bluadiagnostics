[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluadiagnostics"
version = "0.2.0"
description = "BluaDiagnostics — Assistente de IA para Check-up Digital e Prescrição Remota (Sprint 2)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Gustavo Franzoti Gonçalves", email = "rm566983@fiap.com.br" },
    { name = "Lincoln Simão Pereira", email = "lincoln743@gmail.com" },
    { name = "Maykon Santana Fonseca", email = "rm567041@fiap.com.br" },
    { name = "Nicolas Sakaue Nishimura", email = "rm567752@fiap.com.br" },
]
keywords = ["llm", "rag", "langgraph", "healthcare", "multi-agent"]

dependencies = [
    # ---- Core LLM ----
    "groq>=0.11.0",
    "openai>=1.50.0",                 # client compatível usado para Ollama via base_url

    # ---- LangChain / LangGraph ----
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.40",

    # ---- RAG ----
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # ---- Interface ----
    "streamlit>=1.38.0",

    # ---- Utilitários ----
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "tenacity>=9.0.0",
    "rich>=13.8.0",
    "typer>=0.12.0",

    # ---- Observabilidade ----
    "langsmith>=0.1.130",

    # ---- Data viz para evals ----
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
blua-ingest = "src.rag.ingest:main"
blua-eval = "evals.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
